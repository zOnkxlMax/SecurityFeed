name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Läufe auf demselben Branch abbrechen, wenn schnell hintereinander gepusht wird.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax prüfen
        run: python -m compileall -q vulnfeed.py tests

      - name: Shell-Syntax des Sammelskripts
        run: sh -n deploy/dump-container-packages.sh

      - name: Testsuite
        run: python -m unittest discover -s tests -v

      - name: CLI startet und zeigt Hilfe
        run: python vulnfeed.py --help

      - name: Konfigurationsfehler ergibt Exit-Code 2
        run: |
          set +e
          python vulnfeed.py --email
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Ungültiger Zeitplan ergibt Exit-Code 2
        run: |
          set +e
          python vulnfeed.py --schedule "25:00"
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

  docker:
    name: Docker-Image und Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env für den Testlauf erzeugen
        # compose.yaml verlangt eine .env. Bewusst NICHT .env.example kopieren:
        # das Programm weist unveraenderte Platzhalter ab. Die .invalid-Adressen
        # sind per RFC 2606 garantiert nicht aufloesbar - es wird ohnehin keine
        # Verbindung aufgebaut, weil kein Lauf faellig ist.
        run: |
          cat > .env <<'ENDE'
          SECFEED_SMTP_HOST=relay.ci.invalid
          SECFEED_SMTP_PORT=587
          SECFEED_SMTP_SECURITY=starttls
          SECFEED_MAIL_FROM=ci@ci.invalid
          SECFEED_MAIL_TO=ci@ci.invalid
          SECFEED_SUBJECT_PREFIX=[CI]
          SECFEED_SCHEDULE=07:00,18:00
          TZ=Europe/Berlin
          SECFEED_SINCE=2
          ENDE

      - name: compose.yaml validieren
        run: docker compose config

      - name: Image bauen
        run: docker build -t securityfeed:ci .

      - name: Platzhalter aus der Vorlage werden abgewiesen
        # Gegenprobe: mit .env.example muss der Start fehlschlagen, sonst laeuft
        # jemand mit einer garantiert unbrauchbaren Konfiguration los.
        run: |
          set +e
          docker run --rm --env-file .env.example securityfeed:ci --email --once
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Läuft als unprivilegierter Benutzer
        run: |
          id_output=$(docker run --rm --entrypoint id securityfeed:ci -u)
          echo "UID im Container: $id_output"
          test "$id_output" = "10001"

      - name: Zeitzonendaten sind im Image vorhanden
        # Ohne tzdata liefe der Zeitplan still in UTC.
        run: |
          docker run --rm --entrypoint python3 -e TZ=Europe/Berlin securityfeed:ci \
            -c "import time; print(time.tzname); assert time.tzname[0] in ('CET','CEST'), time.tzname"

      - name: CLI im Container
        run: docker run --rm securityfeed:ci --help

      - name: Konfigurationsfehler ergibt Exit-Code 2
        run: |
          set +e
          docker run --rm securityfeed:ci --email
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Scheduler startet und beendet sich auf SIGTERM
        run: |
          # Auf einem self-hosted Runner ueberlebt ein Container aus einem
          # abgebrochenen Lauf - ohne das hier scheitert der naechste am
          # Namenskonflikt statt an der eigentlichen Sache.
          docker rm -f sf-sched 2>/dev/null || true
          docker run -d --name sf-sched \
            -e SECFEED_SCHEDULE=03:00 -e TZ=Europe/Berlin \
            securityfeed:ci --no-state
          for i in $(seq 1 20); do
            docker logs sf-sched 2>&1 | grep -q "im Dauerbetrieb" && break
            sleep 1
          done
          docker logs sf-sched
          docker logs sf-sched 2>&1 | grep -q "im Dauerbetrieb"
          docker logs sf-sched 2>&1 | grep -q "Naechster Lauf"

          # docker stop schickt SIGTERM. Der Scheduler muss die Warteschleife
          # verlassen, statt bis zum Timeout abgewuergt zu werden.
          start=$(date +%s)
          docker stop sf-sched
          echo "Beendet nach $(( $(date +%s) - start ))s"

          code=$(docker inspect -f '{{.State.ExitCode}}' sf-sched)
          echo "Exit-Code: $code"
          docker logs sf-sched 2>&1 | grep -q "Beendet."
          test "$code" -eq 0
          docker rm sf-sched

      - name: compose run beendet sich trotz SECFEED_SCHEDULE
        # Die Service-Umgebung reicht SECFEED_SCHEDULE an "compose run" durch.
        # Ohne die --once/--dry-run-Ausnahme startet dort der Scheduler und der
        # Aufruf haengt - genau der Schritt, den die Anleitung als Test vorgibt.
        run: |
          timeout 120 docker compose run --rm securityfeed \
            --once --no-state --since 2 --limit 1 --format table
          echo "compose run ist beendet, kein Dauerbetrieb"

      - name: Compose-Stack startet mit read-only Dateisystem
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            docker compose logs 2>&1 | grep -q "im Dauerbetrieb" && break
            sleep 1
          done
          docker compose logs
          docker compose logs 2>&1 | grep -q "im Dauerbetrieb"
          # Zeitzone muss aus der compose.yaml durchgereicht werden.
          docker compose logs 2>&1 | grep -qE "Zeitzone CES?T"
          docker compose ps

      - name: Paketlisten der laufenden Container sammeln
        # Gegen echtes Docker, echtes "docker cp", echte Container. Bewusst
        # ohne OSV-Abfrage - Netzabhaengiges gehoert in feeds.yml und soll
        # keinen Pull Request blockieren.
        run: |
          docker run -d --name ci-alpine alpine:3 sleep 300
          # busybox hat weder dpkg noch apk - der Fall "gar keine Paketliste".
          docker run -d --name ci-busybox busybox:latest sleep 300
          sudo ./deploy/dump-container-packages.sh /tmp/ci-container-lists
          find /tmp/ci-container-lists

          # Der SecurityFeed-Container basiert auf bookworm, hat also dpkg.
          # Der Name steht als container_name in der compose.yaml fest.
          test -s /tmp/ci-container-lists/securityfeed/status
          grep -q "^Package: " /tmp/ci-container-lists/securityfeed/status
          # /etc/os-release ist unter Debian ein Symlink - "docker cp -L" muss
          # ihm folgen, sonst steht hier nur ein toter Verweis.
          grep -q "^ID=debian" /tmp/ci-container-lists/securityfeed/os-release

          # Alpine fuehrt seine Pakete in /lib/apk/db/installed.
          test -s /tmp/ci-container-lists/ci-alpine/apk-installed
          grep -q "^P:" /tmp/ci-container-lists/ci-alpine/apk-installed
          grep -q "^ID=alpine" /tmp/ci-container-lists/ci-alpine/os-release
          test ! -f /tmp/ci-container-lists/ci-alpine/unsupported

          # Ohne beides muss der Container als nicht pruefbar vermerkt sein,
          # statt stillschweigend zu fehlen.
          test -s /tmp/ci-container-lists/ci-busybox/unsupported
          grep -q "busybox" /tmp/ci-container-lists/ci-busybox/unsupported

          # Zeitstempel, an dem SecurityFeed veraltete Listen erkennt.
          test -f /tmp/ci-container-lists/updated

          # Beendete Container fliegen beim naechsten Lauf wieder raus.
          docker rm -f ci-alpine ci-busybox
          sudo ./deploy/dump-container-packages.sh /tmp/ci-container-lists
          test ! -d /tmp/ci-container-lists/ci-alpine
          test ! -d /tmp/ci-container-lists/ci-busybox

      - name: Aufräumen
        # Muss auch nach einem Fehlschlag laufen, sonst sammeln sich auf einem
        # self-hosted Runner Container, Volumes und Images an.
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker rm -f sf-sched ci-alpine ci-busybox 2>/dev/null || true
          sudo rm -rf /tmp/ci-container-lists
          rm -f .env

  build-arm64:
    name: Image für Raspberry Pi (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Für linux/arm64 bauen
        run: docker buildx build --platform linux/arm64 -t securityfeed:arm64 --load .

      - name: Unter QEMU starten
        run: docker run --rm --platform linux/arm64 securityfeed:arm64 --help
