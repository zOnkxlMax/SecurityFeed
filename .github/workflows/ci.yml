name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Läufe auf demselben Branch abbrechen, wenn schnell hintereinander gepusht wird.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax prüfen
        run: python -m compileall -q vulnfeed.py tests

      - name: Shell-Syntax des Sammelskripts
        run: sh -n deploy/dump-container-packages.sh

      - name: Testsuite
        run: python -m unittest discover -s tests -v

      - name: CLI startet und zeigt Hilfe
        run: python vulnfeed.py --help

      - name: Konfigurationsfehler ergibt Exit-Code 2
        run: |
          set +e
          python vulnfeed.py --email
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Ungültiger Zeitplan ergibt Exit-Code 2
        run: |
          set +e
          python vulnfeed.py --schedule "25:00"
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Webseite verlangt Anmeldung und Formular-Token
        run: |
          mkdir -p /tmp/sf-state
          cat > /tmp/sf-state/findings.json <<'ENDE'
          {"updated": "2026-09-16T08:00:00+00:00", "subtitle": "CI-Lauf", "failed": [],
           "entries": [{"source": "Lokales System",
                        "title": "openssl 3.0.11-1: 1 Luecke(n) mit verfuegbarem Fix",
                        "link": "https://security-tracker.debian.org/tracker/source-package/openssl",
                        "published": "2026-09-16T08:00:00+00:00", "cves": ["CVE-2024-1001"],
                        "advisory": true, "local": true, "affects_local": ["openssl"],
                        "identity": "local:host:openssl:1:CVE-2024-1001", "summary": "Test"}]}
          ENDE
          SECFEED_WEB_USER=ci SECFEED_WEB_PASSWORD=ci-geheim-123 \
            python vulnfeed.py --serve 127.0.0.1:8099 --state /tmp/sf-state/seen.json &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8099/health >/dev/null && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8099/health | grep -q '^ok$'

          # Ohne Anmeldung nichts zu sehen
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:falsch http://127.0.0.1:8099/)" = "401"

          curl -fs -u ci:ci-geheim-123 http://127.0.0.1:8099/ > /tmp/page.html
          grep -q 'openssl 3.0.11-1' /tmp/page.html
          grep -q 'Offene Funde (1)' /tmp/page.html

          # Akzeptieren ohne Formular-Token: abgelehnt
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-geheim-123 -X POST \
                 --data-urlencode 'identity=local:host:openssl:1:CVE-2024-1001' \
                 http://127.0.0.1:8099/accept)" = "403"
          test ! -f /tmp/sf-state/decisions.json

          # Mit Token: Entscheidung landet in decisions.json, Seite zeigt sie
          token=$(grep -o 'name="token" value="[^"]*"' /tmp/page.html | head -1 | sed 's/.*value="//;s/"$//')
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-geheim-123 -X POST \
                 --data-urlencode "token=$token" \
                 --data-urlencode 'identity=local:host:openssl:1:CVE-2024-1001' \
                 --data-urlencode 'comment=CI' --data-urlencode 'until=' \
                 http://127.0.0.1:8099/accept)" = "303"
          grep -q 'local:host:openssl:1:CVE-2024-1001' /tmp/sf-state/decisions.json
          grep -q '"by": "ci"' /tmp/sf-state/decisions.json
          curl -fs -u ci:ci-geheim-123 http://127.0.0.1:8099/ | grep -q 'Offene Funde (0)'

          # "Jetzt scannen" legt eine Anforderung ab, die der Scheduler abholt
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-geheim-123 -X POST \
                 --data-urlencode "token=$token" http://127.0.0.1:8099/scan)" = "303"
          grep -q '"by": "ci"' /tmp/sf-state/scan-request.json
          curl -fs -u ci:ci-geheim-123 http://127.0.0.1:8099/ | grep -q 'wartet auf den Scanner'
          rm /tmp/sf-state/scan-request.json

          # Verwaltung: nur angemeldet, Passwortwechsel braucht Token und altes Passwort
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/admin)" = "401"
          curl -fs -u ci:ci-geheim-123 http://127.0.0.1:8099/admin > /tmp/admin.html
          grep -q 'Passwort aendern' /tmp/admin.html
          grep -q 'aus der Umgebung' /tmp/admin.html
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-geheim-123 -X POST \
                 --data-urlencode 'current=ci-geheim-123' \
                 --data-urlencode 'new=ci-neu-und-lang-456' --data-urlencode 'repeat=ci-neu-und-lang-456' \
                 http://127.0.0.1:8099/admin/password)" = "403"
          curl -s -u ci:ci-geheim-123 -X POST \
                 --data-urlencode "token=$token" --data-urlencode 'current=geraten' \
                 --data-urlencode 'new=ci-neu-und-lang-456' --data-urlencode 'repeat=ci-neu-und-lang-456' \
                 http://127.0.0.1:8099/admin/password | grep -q 'class="error"'
          test ! -f /tmp/sf-state/web-auth.json

          # Echter Wechsel: altes Passwort sperrt, neues oeffnet, Klartext liegt nirgends
          curl -s -u ci:ci-geheim-123 -X POST \
                 --data-urlencode "token=$token" --data-urlencode 'current=ci-geheim-123' \
                 --data-urlencode 'new=ci-neu-und-lang-456' --data-urlencode 'repeat=ci-neu-und-lang-456' \
                 http://127.0.0.1:8099/admin/password | grep -q 'Passwort geaendert'
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-geheim-123 http://127.0.0.1:8099/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-neu-und-lang-456 http://127.0.0.1:8099/)" = "200"
          test -f /tmp/sf-state/web-auth.json
          ! grep -q 'ci-neu-und-lang-456' /tmp/sf-state/web-auth.json
          grep -q '"user": "ci"' /tmp/sf-state/web-auth.json
          grep -q 'pbkdf2_sha256' /tmp/sf-state/web-auth.json
          curl -fs -u ci:ci-neu-und-lang-456 http://127.0.0.1:8099/admin | grep -q 'gespeichert in web-auth.json'

          # Ein neu gestarteter Server mit derselben Ablage kennt nur das neue Passwort -
          # das aus der Umgebung ist ab jetzt nur noch der Startwert.
          SECFEED_WEB_USER=ci SECFEED_WEB_PASSWORD=ci-geheim-123 \
            python vulnfeed.py --serve 127.0.0.1:8097 --state /tmp/sf-state/seen.json &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8097/health >/dev/null && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-geheim-123 http://127.0.0.1:8097/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-neu-und-lang-456 http://127.0.0.1:8097/)" = "200"
          kill %2

          # Beispielpasswort wird abgewiesen
          set +e
          SECFEED_WEB_USER=ci SECFEED_WEB_PASSWORD=aendere-mich python vulnfeed.py --serve 127.0.0.1:8098
          code=$?
          set -e
          test "$code" -eq 2
          kill %1

  docker:
    name: Docker-Image und Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env für den Testlauf erzeugen
        # compose.yaml verlangt eine .env. Bewusst NICHT .env.example kopieren:
        # das Programm weist unveraenderte Platzhalter ab. Die .invalid-Adressen
        # sind per RFC 2606 garantiert nicht aufloesbar - es wird ohnehin keine
        # Verbindung aufgebaut, weil kein Lauf faellig ist.
        run: |
          cat > .env <<'ENDE'
          SECFEED_SMTP_HOST=relay.ci.invalid
          SECFEED_SMTP_PORT=587
          SECFEED_SMTP_SECURITY=starttls
          SECFEED_MAIL_FROM=ci@ci.invalid
          SECFEED_MAIL_TO=ci@ci.invalid
          SECFEED_SUBJECT_PREFIX=[CI]
          SECFEED_SCHEDULE=07:00,18:00
          TZ=Europe/Berlin
          SECFEED_SINCE=2
          ENDE

      - name: compose.yaml validieren
        run: docker compose config

      - name: Image bauen
        run: docker build -t securityfeed:ci .

      - name: Platzhalter aus der Vorlage werden abgewiesen
        # Gegenprobe: mit .env.example muss der Start fehlschlagen, sonst laeuft
        # jemand mit einer garantiert unbrauchbaren Konfiguration los.
        run: |
          set +e
          docker run --rm --env-file .env.example securityfeed:ci --email --once
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Läuft als unprivilegierter Benutzer
        run: |
          id_output=$(docker run --rm --entrypoint id securityfeed:ci -u)
          echo "UID im Container: $id_output"
          test "$id_output" = "10001"

      - name: Zeitzonendaten sind im Image vorhanden
        # Ohne tzdata liefe der Zeitplan still in UTC.
        run: |
          docker run --rm --entrypoint python3 -e TZ=Europe/Berlin securityfeed:ci \
            -c "import time; print(time.tzname); assert time.tzname[0] in ('CET','CEST'), time.tzname"

      - name: CLI im Container
        run: docker run --rm securityfeed:ci --help

      - name: Konfigurationsfehler ergibt Exit-Code 2
        run: |
          set +e
          docker run --rm securityfeed:ci --email
          code=$?
          set -e
          echo "Exit-Code: $code"
          test "$code" -eq 2

      - name: Scheduler startet und beendet sich auf SIGTERM
        run: |
          # Auf einem self-hosted Runner ueberlebt ein Container aus einem
          # abgebrochenen Lauf - ohne das hier scheitert der naechste am
          # Namenskonflikt statt an der eigentlichen Sache.
          docker rm -f sf-sched 2>/dev/null || true
          docker run -d --name sf-sched \
            -e SECFEED_SCHEDULE=03:00 -e TZ=Europe/Berlin \
            securityfeed:ci --no-state
          for i in $(seq 1 20); do
            docker logs sf-sched 2>&1 | grep -q "im Dauerbetrieb" && break
            sleep 1
          done
          docker logs sf-sched
          docker logs sf-sched 2>&1 | grep -q "im Dauerbetrieb"
          docker logs sf-sched 2>&1 | grep -q "Naechster Lauf"

          # docker stop schickt SIGTERM. Der Scheduler muss die Warteschleife
          # verlassen, statt bis zum Timeout abgewuergt zu werden.
          start=$(date +%s)
          docker stop sf-sched
          echo "Beendet nach $(( $(date +%s) - start ))s"

          code=$(docker inspect -f '{{.State.ExitCode}}' sf-sched)
          echo "Exit-Code: $code"
          docker logs sf-sched 2>&1 | grep -q "Beendet."
          test "$code" -eq 0
          docker rm sf-sched

      - name: compose run beendet sich trotz SECFEED_SCHEDULE
        # Die Service-Umgebung reicht SECFEED_SCHEDULE an "compose run" durch.
        # Ohne die --once/--dry-run-Ausnahme startet dort der Scheduler und der
        # Aufruf haengt - genau der Schritt, den die Anleitung als Test vorgibt.
        run: |
          timeout 120 docker compose run --rm securityfeed \
            --once --no-state --since 2 --limit 1 --format table
          echo "compose run ist beendet, kein Dauerbetrieb"

      - name: Compose-Stack startet mit read-only Dateisystem
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            docker compose logs 2>&1 | grep -q "im Dauerbetrieb" && break
            sleep 1
          done
          docker compose logs
          docker compose logs 2>&1 | grep -q "im Dauerbetrieb"
          # Zeitzone muss aus der compose.yaml durchgereicht werden.
          docker compose logs 2>&1 | grep -qE "Zeitzone CES?T"
          docker compose ps

      - name: Paketlisten der laufenden Container sammeln
        # Gegen echtes Docker, echtes "docker cp", echte Container. Bewusst
        # ohne OSV-Abfrage - Netzabhaengiges gehoert in feeds.yml und soll
        # keinen Pull Request blockieren.
        run: |
          docker run -d --name ci-alpine alpine:3 sleep 300
          # busybox hat weder dpkg noch apk - der Fall "gar keine Paketliste".
          docker run -d --name ci-busybox busybox:latest sleep 300
          # Eigentuemer explizit: auf dem Runner gibt es keinen Benutzer
          # "securityfeed", und mit dem Default 10001 koennte der Runner die
          # Ablage danach selbst nicht mehr lesen.
          sudo ./deploy/dump-container-packages.sh /tmp/ci-container-lists "$(id -u):$(id -g)"
          find /tmp/ci-container-lists

          # Die Ablage ist das Paketinventar aller Container - fuer niemanden
          # sonst lesbar, und sie gehoert dem angegebenen Leser.
          test "$(stat -c %a /tmp/ci-container-lists)" = "750"
          test "$(stat -c %a /tmp/ci-container-lists/securityfeed)" = "750"
          test "$(stat -c %a /tmp/ci-container-lists/securityfeed/status)" = "640"
          test "$(stat -c %a /tmp/ci-container-lists/updated)" = "640"
          test "$(stat -c %u /tmp/ci-container-lists/securityfeed/status)" = "$(id -u)"

          # Der SecurityFeed-Container basiert auf bookworm, hat also dpkg.
          # Der Name steht als container_name in der compose.yaml fest.
          test -s /tmp/ci-container-lists/securityfeed/status
          grep -q "^Package: " /tmp/ci-container-lists/securityfeed/status
          # /etc/os-release ist unter Debian ein Symlink - "docker cp -L" muss
          # ihm folgen, sonst steht hier nur ein toter Verweis.
          grep -q "^ID=debian" /tmp/ci-container-lists/securityfeed/os-release

          # Alpine fuehrt seine Pakete in /lib/apk/db/installed.
          test -s /tmp/ci-container-lists/ci-alpine/apk-installed
          grep -q "^P:" /tmp/ci-container-lists/ci-alpine/apk-installed
          grep -q "^ID=alpine" /tmp/ci-container-lists/ci-alpine/os-release
          test ! -f /tmp/ci-container-lists/ci-alpine/unsupported

          # Ohne beides muss der Container als nicht pruefbar vermerkt sein,
          # statt stillschweigend zu fehlen.
          test -s /tmp/ci-container-lists/ci-busybox/unsupported
          grep -q "busybox" /tmp/ci-container-lists/ci-busybox/unsupported

          # Zeitstempel, an dem SecurityFeed veraltete Listen erkennt.
          test -f /tmp/ci-container-lists/updated

          # Beendete Container fliegen beim naechsten Lauf wieder raus.
          docker rm -f ci-alpine ci-busybox
          sudo ./deploy/dump-container-packages.sh /tmp/ci-container-lists "$(id -u):$(id -g)"
          test ! -d /tmp/ci-container-lists/ci-alpine
          test ! -d /tmp/ci-container-lists/ci-busybox

      - name: Aufräumen
        # Muss auch nach einem Fehlschlag laufen, sonst sammeln sich auf einem
        # self-hosted Runner Container, Volumes und Images an.
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker rm -f sf-sched ci-alpine ci-busybox 2>/dev/null || true
          sudo rm -rf /tmp/ci-container-lists
          rm -f .env

  build-arm64:
    name: Image für Raspberry Pi (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Für linux/arm64 bauen
        run: docker buildx build --platform linux/arm64 -t securityfeed:arm64 --load .

      - name: Unter QEMU starten
        run: docker run --rm --platform linux/arm64 securityfeed:arm64 --help
